:root{
  --verde:#0B6B3A; --verde2:#16A34A; --verde-claro:#E8F6ED;
  --azul:#0A6E9E; --rojo:#D32F2F; --amarillo:#E5A200; --oro:#C79A00;
  --tinta:#0F1F1A; --gris:#5B6B65; --gris2:#8A9A94;
  --linea:#DCE6E1; --fondo:#F4F7F5; --blanco:#fff;
  --sombra:0 1px 2px rgba(15,31,26,.06),0 8px 24px rgba(15,31,26,.06);
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Montserrat","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--tinta);font-size:14.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.02em;font-weight:800}
h1{font-size:25px;letter-spacing:-.025em} h2{font-size:19px;letter-spacing:-.02em} h3{font-size:15.5px}
a{color:var(--azul);text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco);color:var(--tinta);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
label{display:block;font-size:11.5px;font-weight:600;color:var(--gris);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.field{margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:18px;box-shadow:var(--sombra)}
.card h3{margin-bottom:12px}
.muted{color:var(--gris)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:var(--verde);color:#fff;font-weight:600;font-size:13.5px;letter-spacing:.01em;transition:.15s;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--blanco);color:var(--tinta);border:1px solid var(--linea)}
.btn.sec:hover{background:var(--fondo)}
.btn.azul{background:var(--azul)} .btn.rojo{background:var(--rojo)} .btn.oro{background:var(--oro);color:#231a00}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill.ok{background:#E6F6EC;color:#0B6B3A}
.pill.warn{background:#FFF4DC;color:#8A5B00}
.pill.bad{background:#FDE7E7;color:#A31616}
.pill.info{background:#E4F1F8;color:#075A80}
.pill.gray{background:#EEF2F0;color:#54635D}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris);padding:8px 10px;border-bottom:1px solid var(--linea);font-weight:700;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #EDF2EF;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFB}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* Login */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-brand{background:linear-gradient(160deg,#08301D 0%,#0B6B3A 55%,#0E8A4A 100%);color:#fff;padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-brand:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);right:-160px;top:-120px}
.brandmark{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:transparent;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.logo.sm{width:38px;height:38px;border-radius:11px}
.auth-brand h1{font-size:36px;margin-top:34px;line-height:1.14;font-weight:800;letter-spacing:-.03em}
.auth-brand p{color:rgba(255,255,255,.82);max-width:440px;margin:14px 0 0;font-size:13.5px;line-height:1.7}
.flag{display:flex;height:6px;width:120px;border-radius:99px;overflow:hidden;margin-top:26px}
.flag i{flex:1}
.auth-panel{display:grid;place-items:center;padding:40px 28px;background:var(--blanco)}
.auth-box{width:100%;max-width:420px}
.tabs{display:flex;gap:4px;background:#EEF3F0;padding:4px;border-radius:11px;margin-bottom:22px}
.tabs button{flex:1;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:650;color:var(--gris);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* App shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#08301D;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{width:40px;height:40px;border-radius:11px;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side-brand b{font-size:17px;letter-spacing:.02em}
.side-brand span{display:block;font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.74);font-size:13px;font-weight:500;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:var(--verde2);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.nav .ico{width:18px;height:18px;display:grid;place-items:center;opacity:.9;flex:0 0 18px}
.nav .ico svg{width:17px;height:17px}
.nav-sep{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:14px 12px 6px;font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--linea);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--verde-claro);color:var(--verde);display:grid;place-items:center;font-weight:800;font-size:13px}
.content{padding:26px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--gris);font-size:13.5px}
/* Grade colors */
.gr{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:3px 9px;border-radius:7px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.gr .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.g-susp{background:#FDE7E7;color:#B3261E}
.g-noapto{background:#FFEAD9;color:#B4510A}
.g-apto{background:#FFF6D6;color:#8A6400}
.g-notable{background:#E3EEFB;color:#1358A8}
.g-sobre{background:#E2F5E8;color:#0B6B3A}
/* progress */
.bar{height:8px;background:#EDF2EF;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);font-weight:700}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--gris2)}
/* schedule */
.sched{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.sched th{background:transparent;border:0;text-align:center;padding:6px 2px}
.sched td{border:0;padding:0;vertical-align:top}
.slot{background:#fff;border:1px solid var(--linea);border-radius:9px;padding:6px 8px;min-height:52px;overflow:hidden}
.slot .h{font-size:10.5px;color:var(--gris2);font-weight:700;letter-spacing:.03em}
.slot .s{font-size:12px;font-weight:700;line-height:1.25;margin-top:1px}
.slot .t{font-size:9.5px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.free{background:#FAFCFB;border-style:dashed;color:var(--gris2)}
.lesson{border-left:4px solid;background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lesson .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13.5px}
.lesson .l2{font-size:12px;color:var(--gris)}
/* misc */
.hero{background:linear-gradient(120deg,#08301D,#0B6B3A 60%,#12894B);color:#fff;border-radius:var(--radio);padding:24px;position:relative;overflow:hidden}
.hero h2{font-size:21px} .hero p{color:rgba(255,255,255,.8);margin:8px 0 0;max-width:520px;font-size:13.5px}
.hero .deco{position:absolute;right:-40px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.notice{padding:12px 14px;border-radius:11px;font-size:13px;border:1px solid;line-height:1.45}
.notice.warn{background:#FFF9EC;border-color:#F1DCA6;color:#6E4E00}
.notice.bad{background:#FDF0F0;border-color:#F3C4C4;color:#8E1B1B}
.notice.ok{background:#EEF9F2;border-color:#BFE5CC;color:#0A5A31}
.notice.info{background:#EDF6FB;border-color:#C2DDEC;color:#0A4E6E}
.empty{padding:26px;text-align:center;color:var(--gris2);font-size:13px;border:1px dashed var(--linea);border-radius:11px}
.codebox{font-weight:800;font-size:19px;letter-spacing:.08em;background:var(--fondo);border:1px dashed var(--linea);border-radius:10px;padding:12px;text-align:center;font-variant-numeric:tabular-nums}
.rule{margin-top:14px;border-top:1px solid var(--linea);padding-top:12px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--gris)}
.rule b{color:var(--tinta)}
.audit-sub{display:none;margin-top:3px;color:var(--gris2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipbtn{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--gris)}
.chipbtn.on{background:var(--verde-claro);border-color:var(--verde2);color:var(--verde)}
.subjbox{max-height:210px;overflow:auto;border:1px solid var(--linea);border-radius:10px;padding:10px;background:#FBFDFC}
.subjgroup{margin-bottom:8px}
.subjlab{display:flex!important;align-items:center;gap:7px;text-transform:none!important;letter-spacing:0!important;font-weight:500!important;font-size:12.5px!important;color:var(--tinta)!important;margin:0!important;cursor:pointer}
.subjlab input{width:15px;height:15px;flex:0 0 15px;padding:0}
.subjlab .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.qrbox{display:grid;place-items:center;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px}
.qrbox svg{width:190px;height:190px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(8,20,16,.55);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{font-size:22px;color:var(--gris2);line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--fondo)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#08301D;color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.hide{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:650;color:var(--gris)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.price{display:flex;flex-direction:column;gap:10px;border:2px solid var(--linea);border-radius:var(--radio);padding:18px;background:#fff;position:relative}
.price.best{border-color:var(--verde2);box-shadow:0 10px 30px rgba(22,163,74,.13)}
.price .amt{font-size:29px;font-weight:800;letter-spacing:-.035em}
.price .amt small{font-size:13px;font-weight:600;color:var(--gris);letter-spacing:0}
.price ul{margin:0;padding-left:18px;font-size:13px;color:var(--gris);line-height:1.7}
.price .tag{position:absolute;top:-11px;right:14px}
.badge-top{position:absolute;top:-11px;right:14px;background:var(--verde2);color:#fff;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase}
@media(max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-brand{padding:28px;min-height:200px}
  .auth-brand h1{font-size:28px;margin-top:16px}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:60;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .content{padding:16px}
  .top{padding:10px 14px}
  .sched{font-size:11px}
  .top{flex-wrap:wrap;gap:8px;padding:10px 14px}
  .top .who{margin-left:0;width:100%;justify-content:space-between;gap:8px}
  .who-txt{display:none}
  .school-top{min-width:0;flex:1}
  .sname{font-size:13px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .ssub{display:none}
  .page-head h1{font-size:22px}
  .modal{padding:16px}
  .qrbox svg{width:150px;height:150px}
  .card{overflow-x:auto}
  table{font-size:12px}
  .sched{min-width:680px}
  .t-term,.col-opt{display:none!important}
  .audit-sub{display:block}
  .audit-table{table-layout:fixed;width:100%}
  .audit-table th:nth-child(1),.audit-table td:nth-child(1){width:88px;white-space:normal!important}
  .audit-table th:last-child,.audit-table td:last-child{width:96px}
  .audit-table td{padding:8px 5px;overflow-wrap:anywhere;font-size:11.5px}
  .auth-brand{min-height:0;padding:26px 24px 22px}
  .auth-brand h1{font-size:26px;margin-top:12px}
  .auth-brand p{font-size:12.5px;margin-top:10px}
  .auth-brand .flag{margin-top:14px}
  .auth-brand>div:last-child{font-size:10px;margin-top:14px}
}

/* ---------- Documento imprimible ---------- */
.print-doc{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:26px;box-shadow:var(--sombra);max-width:900px;margin:0 auto;color:#0F1F1A}
.print-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--verde);padding-bottom:10px;margin-bottom:12px}
.ph-logo{width:46px;height:46px;flex:0 0 46px}
.ph-logo svg{width:100%;height:100%;display:block}
.ph-name{font-weight:800;font-size:15px;line-height:1.25}
.ph-meta{font-size:10.5px;color:var(--gris);margin-top:2px}
.ph-date{margin-left:auto;text-align:right;font-size:11.5px;font-weight:600;color:var(--gris)}
.ph-title{font-size:15px;font-weight:800;margin:2px 0 2px;color:var(--verde)}
.ph-sub{font-size:11.5px;color:var(--gris);margin-bottom:10px}
.print-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
.print-table th{background:#EEF4F0;color:#0F1F1A;font-size:9pt;text-transform:uppercase;letter-spacing:.05em;padding:5px 6px;border:1px solid #D6E2DB}
.print-table td{border:1px solid #E2EAE5;padding:4.5px 6px;vertical-align:top}
.print-table .b{font-weight:700}
.print-foot{margin-top:10px;font-size:11px;color:var(--gris)}
.print-sign{margin-top:34px;border-top:1px solid var(--linea);width:240px;font-size:10px;color:var(--gris2);padding-top:4px}
.print-block+.print-block{margin-top:26px}
@media print{
  @page{size:A4 portrait;margin:14mm 15mm}
  body{background:#fff}
  .side,.top,.no-print,#toast,#modal{display:none!important}
  .shell{display:block!important}
  .content{padding:0!important;max-width:none!important}
  .print-doc{border:0;border-radius:0;box-shadow:none;padding:0;max-width:none}
  .print-block.new-page{page-break-before:always}
  .print-block{page-break-inside:avoid}
  .print-table th{background:#EEF4F0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{text-decoration:none;color:inherit}
}

.side{background:#0A1128!important}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:5px;z-index:99;background:linear-gradient(90deg,#0072CE 0 25%,#3E9B4F 25% 50%,#fff 50% 75%,#E43D30 75%)}
.card,.auth-box{border-radius:20px}
.lgr{min-height:100vh;background:#F8FAFC;display:flex;justify-content:center;padding:calc(36px + env(safe-area-inset-top,0px)) 22px 40px}.lgr-in{width:100%;max-width:460px}

/* ============================================================
   EDUGE · Educación en Guinea Ecuatorial
   Núcleo de datos y reglas de negocio
   ============================================================ */
const RATES = { XAF: 655.957, USD: 1.09 };           // 1 EUR = 655,957 XAF (paridad fija BEAC)
const TRIAL_DAYS = 90;                                // 3 meses de prueba
const STORE_KEY = 'EDUGE_DB_v1';

const PLANS = {

  prof: { key:'prof', name:'Profesorado',          year:80,  month:8.34,  quarter:25,    yearIfSub:100 },
  alum: { key:'alum', name:'Alumnado',             year:30,  month:4.17,  quarter:12.50, yearIfSub:50  }

function courseKey(c){ return (c.level||'ESBA')+':'+(c.course||'1')+':'+(c.career||''); }
function defaultCourseList(){
  const out = [1,2,3,4].map(n=>({ level:'ESBA', course:String(n), career:null, label:n+'º curso ESBA' }));
  ['salud','sociales','tecnicas'].forEach(c=>out.push({ level:'BACH', course:'1', career:c, label:'Bachillerato · '+careerName('BACH',c).split('· ')[1] }));
  ['medicina','enfermeria','derecho','economia','informatica','magisterio','agronomia'].forEach(c=>out.push({ level:'UNI', course:'1', career:c, label:'Universidad · '+careerName('UNI',c) }));
  return out;
}
function coursesOfSchool(schoolId){
  const map = new Map();
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId).forEach(s=>{
    const k = courseKey(s);
    if (!map.has(k)) map.set(k, { level:s.level, course:s.course, career:s.career||null, label:courseLabel(s) });
  });
  const list = Array.from(map.values());
  return list.sort((a,b)=> levelRank(a.level)-levelRank(b.level) || String(a.course).localeCompare(String(b.course)) || (a.career||'').localeCompare(b.career||''));
}
function teacherSubjectOptions(schoolId){
  const courses = coursesOfSchool(schoolId);
  const base = courses.length ? courses : defaultCourseList();
  return base.map(c=>({ course:c, subjects:subjectsFor(c.level, c.course, c.career) }));
}
function groupsOfCourse(schoolId, level, course, career){
  const set = new Set();
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId && u.level===level && String(u.course)===String(course) && (u.career||null)===(career||null))
    .forEach(s=>set.add(s.group||'A'));
  return Array.from(set).sort();
}
function nextGroupFor(schoolId, level, course, career){
  const n = DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId && u.level===level && String(u.course)===String(course) && (u.career||null)===(career||null)).length;

function subjectTeachers(schoolId, subjectId){

}
function levelRank(l){ return l==='ESBA'?1:l==='BACH'?2:l==='UNI'?3:4; }
function groupLetters(n){ return Array.from({length:Math.max(0,n)},(_,i)=>String.fromCharCode(65+i)); }
function groupsForCourse(schoolId, level, course, career){
  const sc = schoolById(schoolId);
  const key = (level||'ESBA')+':'+(course||'1')+':'+((level==='ESBA'?null:career)||'');
  const cfg = sc && sc.groups ? (sc.groups[key]||0) : 0;
  if (cfg > 0) return groupLetters(cfg);
  const used = new Set();
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId && u.level===level && String(u.course)===String(course) && (u.career||null)===((level==='ESBA'?null:career)||null))
    .forEach(x=>used.add(x.group||'A'));
  return used.size ? Array.from(used).sort() : ['A'];
}

  const p = (k||'').split(':');
  return courseLabel({ level:p[0]||'ESBA', course:p[1]||'1', career:p[2]||null });

  const course = document.getElementById(courseSelId) ? document.getElementById(courseSelId).value : '1';

  const letters = scId ? groupsForCourse(scId, level, course, career) : ['A'];

  el.innerHTML = letters.map(g=>`<option>${g}</option>`).join('');

}
function studentsOfCourse(schoolId, key){
  const p = (key||'').split(':'); const level = p[0], course = p[1], career = p[2]||null;
  return DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId && u.level===level && String(u.course)===String(course)
    && ((u.level==='ESBA'?null:u.career)||null)===(career||null))
    .sort((a,b)=>a.name.localeCompare(b.name,'es'));
}
function autoPlanGroups(schoolId, key, n){
  const students = studentsOfCourse(schoolId, key);
  n = Math.max(1, Math.min(8, n||1));
  const letters = groupLetters(n);
  const base = Math.floor(students.length / n), rem = students.length % n;
  let i = 0;
  const out = letters.map((g, idx)=>{
    const take = base + (idx < rem ? 1 : 0);
    const list = students.slice(i, i + take); i += take;
    return { g, list };
  });
  return { students, out, n };
}

/* ---------- Códigos de centro a partir de sus iniciales ---------- */
const CODE_STOP = new Set(['de','del','la','el','los','las','y','e','en','para','por','con','al','the']);
function codePrefix(name){
  const raw = (name||'').trim();
  const explicit = /\(([A-Za-zÁÉÍÓÚÜÑ]{2,8})\)\s*$/.exec(raw) || /\(([A-Za-zÁÉÍÓÚÜÑ]{2,8})\)/.exec(raw);
  if (explicit) return explicit[1].toUpperCase();
  const words = raw.replace(/[()·,.\-]/g,' ').split(/\s+/).filter(w=> w.length>2 && !CODE_STOP.has(norm(w)));
  let p = words.map(w=>w[0]).join('');
  p = p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if (!p) p = 'CEN';
  return p.slice(0,4);
}
function buildSchoolCode(name, seq){
  return codePrefix(name) + '-' + String(seq).padStart(4,'0');
}

  (DB.schools||[]).forEach(s=>{
    if (/^EDUGE-EG-\d+$/i.test(s.code||'')){
      const n = Number(/(\d+)\s*$/.exec(s.code)[1]);

/* ---------- Cálculo académico ---------- */
function termResult(enr, term){
  const t = enr.terms[term]; if (!t) return null;
  const level = levelForSubject(enr.subjectId);
  const shares = catShares(level);
  const all = (t.acts||[]);
  const graded = all.filter(a=>a.g!==null && a.g!==undefined && a.g!=='' && !isNaN(a.g));
  const cond = (level==='UNI' || t.conducta===null || t.conducta===undefined || t.conducta==='') ? null : Number(t.conducta);
  if (!graded.length && cond===null) return null;
  const byCat = { eval:[], part:[] };
  graded.forEach(a=>{ byCat[activityCategory(a)].push(a); });
  let acc = 0, div = 0;
  ['eval','part'].forEach(c=>{
    const items = byCat[c];
    if (!items.length || !shares[c]) return;
    const sumW = items.reduce((s,a)=>s+(Number(a.w)||1),0);
    const avg = items.reduce((s,a)=>s + ((Number(a.w)||1)/sumW) * Number(a.g), 0);
    acc += shares[c] * avg;
    div += shares[c];
  });
  if (cond !== null && shares.cond){
    acc += shares.cond * cond;
    div += shares.cond;
  }
  const final = div ? acc/div : null;
  return { final:+final.toFixed(2), conducta:cond, acts:graded, weights:div,
           catAvg:{ eval: byCat.eval.length? +(byCat.eval.reduce((s,a)=>s+Number(a.g),0)/byCat.eval.length).toFixed(2):null,
                    part: byCat.part.length? +(byCat.part.reduce((s,a)=>s+Number(a.g),0)/byCat.part.length).toFixed(2):null } };
}
function effectiveWeight(act, acts, level){
  const cat = activityCategory(act);
  const share = catShares(level)[cat] || 0;
  const items = (acts||[]).filter(a=>activityCategory(a)===cat);
  if (!items.length) return 0;
  const sumW = items.reduce((s,a)=>s+(Number(a.w)||1),0);
  return +(((Number(act.w)||1)/sumW)*share).toFixed(1);
}
function annualResult(studentId){
  const ens = enrollmentsOf(studentId);
  let sum = 0, n = 0;
  ens.forEach(e=>{
    const lev = levelForSubject(e.subjectId) || (DB.users.find(u=>u.id===e.studentId)||{}).level || 'ESBA';
    periodsForLevel(lev).forEach(t=>{ const r = termResult(e,t); if (r){ sum += r.final; n++; } });
  });
  return n ? +(sum/n).toFixed(2) : null;
}
function subjectAverage(studentId){
  const ens = enrollmentsOf(studentId);
  const rows = ens.map(e=>{
    const lev = levelForSubject(e.subjectId) || (DB.users.find(u=>u.id===e.studentId)||{}).level || 'ESBA';
    const rs = periodsForLevel(lev).map(t=>termResult(e,t)).filter(Boolean);
    const avg = rs.length ? +(rs.reduce((s,r)=>s+r.final,0)/rs.length).toFixed(2) : null;
    return { enr:e, subject:subjectById(e.subjectId), avg, terms:rs.map(r=>r.final) };
  });
  return rows;
}

/* ---------- Avance del temario ---------- */
function syllabusProgress(schoolId, period){
  const groups = new Map();
  (DB.syllabus||[]).filter(x=>x.schoolId===schoolId).forEach(entry=>{
    const lev = levelForSubject(entry.subjectId);
    const per = Math.min(period, periodsForLevel(lev).length);
    if (entry.period !== per) return;
    if (!groups.has(entry.subjectId)) groups.set(entry.subjectId, { total:new Map(), taught:new Set() });
    const g = groups.get(entry.subjectId);
    (entry.topics||[]).forEach(t=>{ g.total.set(t.id, t); if (t.taught) g.taught.add(t.id); });
  });
  return Array.from(groups.entries()).map(([sid,g])=>{
    const total = Array.from(g.total.values());
    const taught = total.filter(t=>g.taught.has(t.id));
    return {
      subjectId: sid,
      subject: subjectById(sid),
      total, taught,
      pct: total.length ? Math.round(taught.length/total.length*100) : 0,
      pending: total.filter(t=>!g.taught.has(t.id))
    };
  }).sort((a,b)=> a.pct - b.pct || a.subject.n.localeCompare(b.subject.n,'es'));
}

  const g = gatewayCfg();
  if (g.mode === 'auto'){
    if (!g.endpoint || !g.merchantKey) return { label:'Configuración incompleta', cls:'warn', ok:false };
    if (g.lastCheck && g.lastCheck.ok) return { label:'Conectada', cls:'ok', ok:true };
    if (g.lastCheck && !g.lastCheck.ok) return { label:'Sin conexión', cls:'bad', ok:false };
    return { label:'Sin comprobar', cls:'gray', ok:false };
  }
  return { label:'Verificación manual', cls:'info', ok:true };
}

/* ---------- Auditoría de accesos ---------- */
function deviceInfo(){
  const ua = navigator.userAgent || '';
  let os = 'Desconocido';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
  else if (/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  let br = 'Navegador';
  if (/Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\//.test(ua) || /Opera/.test(ua)) br = 'Opera';
  else if (/Chrome\//.test(ua)) br = 'Chrome';
  else if (/Safari\//.test(ua)) br = 'Safari';
  else if (/Firefox\//.test(ua)) br = 'Firefox';
  const type = /Móvil|Mobile|Android|iPhone|iPad/.test(ua) ? 'Móvil / tableta' : 'Ordenador';
  return { os, br, type, label: br+' · '+os, screen:(window.innerWidth||0)+'×'+(window.innerHeight||0) };
}
function fmtDT(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const f = d.toLocaleDateString('es-ES',{ day:'2-digit', month:'short', year:'numeric' });
  const h = d.toLocaleTimeString('es-ES',{ hour:'2-digit', minute:'2-digit' });
  return f + ' · ' + h;
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('es-ES',{ day:'2-digit', month:'2-digit', year:'numeric' });
}
function logAccess(u, opts){
  if (!DB.audit) DB.audit = [];
  const d = deviceInfo();
  DB.audit.push({
    id: uid('log'), action:'login', at:new Date().toISOString(),
    schoolId: u.schoolId || S.schoolId || null,
    userId: u.id, name: u.name, role: u.role,
    mode: (opts && opts.mode) || '', code: (opts && opts.code) || '',
    device:d.label, os:d.os, br:d.br, type:d.type, screen:d.screen
  });
  if (DB.audit.length > 600) DB.audit = DB.audit.slice(-600);
  saveDB();
}
function nextCodeSeq(){
  let max = 0;
  DB.schools.forEach(s=>{
    [s.code].concat((s.codeHistory||[]).map(h=>h.code)).forEach(c=>{
      const m = /(\d+)\s*$/.exec(c||'');
      if (m) max = Math.max(max, Number(m[1]));
    });
  });
  return max + 1;
}
function nextSchoolCode(sc){
  const name = (sc && sc.name) || 'Centro';
  return buildSchoolCode(name, nextCodeSeq());
}
function auditForSchool(schoolId, onlyCenter){
  return (DB.audit||[])
    .filter(e=>e.schoolId===schoolId && e.action==='login' && e.role==='prof' && (!onlyCenter || e.mode==='centro'))
    .slice().sort((a,b)=> (a.at<b.at?1:-1));
}

/* ---------- Licencias y cobertura ---------- */
function addCycle(dateISO, cycle){
  const d = new Date(dateISO+'T12:00:00');
  if (cycle==='year') d.setFullYear(d.getFullYear()+1);
  if (cycle==='quarter') d.setMonth(d.getMonth()+3);
  if (cycle==='month') d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function schoolCoverage(schoolId){
  const sc = schoolById(schoolId); if (!sc) return null;
  if (sc.plan && sc.plan.status==='activo' && sc.plan.paidUntil && daysLeft(sc.plan.paidUntil) >= 0) return { ok:true, until:sc.plan.paidUntil, source:'inst' };
  return { ok:false, until:null, source:null };
}
function accessCodeFor(u){
  if (!u) return '';
  let h = 0; const base = (u.id||'') + (u.phone||'') + (u.email||'');
  for (let i=0;i<base.length;i++) h = (h*31 + base.charCodeAt(i)) % 100000;
  return 'PROF-EG-' + String(1000 + (h % 9000));
}
function licenseState(u){
  if (!u) return { status:'bloqueado', label:'Sin sesión', days:0, source:'—', until:null, code:'', mode:'none' };
  const sc = schoolById(u.schoolId);

  /* ---- Profesorado: primero el centro, después su propia suscripción ---- */
  if (u.role==='prof'){
    const cov = u.schoolId ? schoolCoverage(u.schoolId) : { ok:false };
    if (cov.ok) return { status:'activo', label:'Acceso por el centro', days:daysLeft(cov.until), source:'institución',
                         until:cov.until, code:(sc?sc.code:''), mode:'centro' };
    const li = u.license || {};
    if (li.paidUntil && daysLeft(li.paidUntil) >= 0)
      return { status:'activo', label:'Suscripción personal', days:daysLeft(li.paidUntil), source:'profesor',
               until:li.paidUntil, code:accessCodeFor(u), mode:'personal' };
    const trialEnd = li.trialEnd || addDays(u.createdAt || todayISO(), TRIAL_DAYS);
    if (daysLeft(trialEnd) >= 0)
      return { status:'prueba', label:'Periodo de prueba', days:daysLeft(trialEnd), source:'prueba',
               until:trialEnd, code:accessCodeFor(u), mode:'trial' };
    return { status:'bloqueado', label:'Sin licencia activa', days:daysLeft(trialEnd), source:'—',
             until:trialEnd, code:accessCodeFor(u), mode:'bloqueado' };
  }

  /* ---- Alumnado: centro → familia → licencia propia ---- */
  if (u.role==='alumno'){
    if (u.schoolId){
      const cov = schoolCoverage(u.schoolId);
      if (cov.ok) return { status:'activo', label:'Cubierto por el centro', days:daysLeft(cov.until), source:'institución',
                           until:cov.until, code:(sc?sc.code:''), mode:'centro' };
    }
    const fams = DB.users.filter(f=>f.role==='familia' && (f.children||[]).includes(u.id));
    for (const f of fams){
      const fl = f.license || {};
      if (fl.paidUntil && daysLeft(fl.paidUntil) >= 0)
        return { status:'activo', label:'Cubierto por la familia', days:daysLeft(fl.paidUntil), source:'familia',
                 until:fl.paidUntil, code:'', mode:'familia' };
    }
    const li = u.license || {};
    if (li.paidUntil && daysLeft(li.paidUntil) >= 0)
      return { status:'activo', label:'Licencia del alumno', days:daysLeft(li.paidUntil), source:'propia',
               until:li.paidUntil, code:'', mode:'personal' };
    const trialEnd = li.trialEnd || addDays(u.createdAt || todayISO(), TRIAL_DAYS);
    if (daysLeft(trialEnd) >= 0)
      return { status:'prueba', label:'Periodo de prueba', days:daysLeft(trialEnd), source:'prueba', until:trialEnd, code:'', mode:'trial' };
    return { status:'bloqueado', label:'Licencia vencida', days:daysLeft(trialEnd), source:'—', until:trialEnd, code:'', mode:'bloqueado' };
  }

  /* ---- Familia: hijo con licencia → centro del hijo → licencia propia ---- */
  if (u.role==='familia'){
    const kids = (u.children||[]).map(userById).filter(Boolean);
    for (const k of kids){
      const kl = k.license || {};
      if (kl.paidUntil && daysLeft(kl.paidUntil) >= 0)
        return { status:'activo', label:'Cubierto por el alumno', days:daysLeft(kl.paidUntil), source:'alumno',
                 until:kl.paidUntil, code:'', mode:'alumno' };
    }
    for (const k of kids){
      if (k.schoolId){
        const cov = schoolCoverage(k.schoolId);
        if (cov.ok) return { status:'activo', label:'Cubierto por el centro del alumno', days:daysLeft(cov.until), source:'institución',
                             until:cov.until, code:(schoolById(k.schoolId)||{}).code||'', mode:'centro' };
      }
    }
    const li = u.license || {};
    if (li.paidUntil && daysLeft(li.paidUntil) >= 0)
      return { status:'activo', label:'Licencia familiar', days:daysLeft(li.paidUntil), source:'propia',
               until:li.paidUntil, code:'', mode:'personal' };
    const trialEnd = li.trialEnd || addDays(u.createdAt || todayISO(), TRIAL_DAYS);
    if (daysLeft(trialEnd) >= 0)
      return { status:'prueba', label:'Periodo de prueba', days:daysLeft(trialEnd), source:'prueba', until:trialEnd, code:'', mode:'trial' };
    return { status:'bloqueado', label:'Licencia vencida', days:daysLeft(trialEnd), source:'—', until:trialEnd, code:'', mode:'bloqueado' };
  }

  /* ---- Institución ---- */
  const li = u.license || {};
  if (li.paidUntil && daysLeft(li.paidUntil) >= 0)
    return { status:'activo', label:'Licencia del centro', days:daysLeft(li.paidUntil), source:'propia',
             until:li.paidUntil, code:(sc?sc.code:''), mode:'personal' };
  const trialEnd = li.trialEnd || addDays(u.createdAt || todayISO(), TRIAL_DAYS);
  if (daysLeft(trialEnd) >= 0)
    return { status:'prueba', label:'Periodo de prueba', days:daysLeft(trialEnd), source:'prueba', until:trialEnd, code:(sc?sc.code:''), mode:'trial' };
  return { status:'bloqueado', label:'Licencia vencida', days:daysLeft(trialEnd), source:'—', until:trialEnd, code:(sc?sc.code:''), mode:'bloqueado' };
}
function licensePill(u){
  const st = licenseState(u);
  const cls = st.status==='activo'?'ok':st.status==='prueba'?'warn':'bad';
  const src = st.source==='institución' ? 'centro' : st.source==='familia' ? 'familia' : st.source==='alumno' ? 'alumno' : 'propia';
  const txt = st.status==='activo' ? ('Activa · '+src) :
              st.status==='prueba' ? ('Prueba · '+st.days+' días') : 'Bloqueada';
  return '<span class="pill '+cls+'">'+txt+'</span>';
}
function canUse(u){ return licenseState(u).status !== 'bloqueado'; }
/* ---------- Autenticación ---------- */
function findByLogin(idf){
  const k = norm(idf);
  return DB.users.find(u => norm(u.phone)===k || norm(u.email)===k);
}
function doLogin(e){
  e.preventDefault();
  const idf = document.getElementById('lg_id').value.trim();
  const pass = document.getElementById('lg_pass').value;
  const schoolId = document.getElementById('lg_school') ? document.getElementById('lg_school').value : '';
  const u = findByLogin(idf);
  if (!u) return flash('lg_err','No existe ninguna cuenta con ese número o correo.');
  if (u.pass !== pass) return flash('lg_err','Contraseña incorrecta.');
  if (u.role==='prof'){
    const st = licenseState(u);
    const code = (document.getElementById('lg_code')?.value || '').trim().toUpperCase();
    if (st.status==='bloqueado')
      return flash('lg_err','Tu licencia no está activa. Entra con otra cuenta o activa la suscripción del centro o la tuya personal.');
    if (st.mode==='centro' && code !== (st.code||'').toUpperCase())
      return flash('lg_err','Este centro tiene la licencia activa: el acceso del profesorado es solo con el código del centro que entrega la dirección.');
    if (st.mode==='personal' && code !== (st.code||'').toUpperCase())
      return flash('lg_err','Tu acceso es por suscripción personal: introduce el código personal que aparece en «Mi licencia».');
  }
  if (u.role==='alumno' && u.level==='ESBA' && u.schoolId){
    if (!schoolId) return flash('lg_err','Selecciona tu colegio.');
    if (u.schoolId !== schoolId) return flash('lg_err','Ese alumno no pertenece al colegio seleccionado. Solo puedes acceder al centro donde estás matriculado.');
  }
  S.user = u; S.schoolId = u.schoolId || (u.schoolIds||[])[0] || null; S.view='inicio'; S.term = 1;
  if (u.role==='prof'){
    const st = licenseState(u);
    logAccess(u, { mode: st.mode, code: (st.mode==='centro' ? st.code : ((document.getElementById('lg_code')?.value||'').trim().toUpperCase() || st.code)) });
  }
  if (!canUse(u)) S.view = 'licencia';
  if (u.role==='alumno' && !u.schoolId) S.view = 'vincular';
  const hv = (location.hash||'').replace('#','');
  if (hv && (NAV[u.role]||[]).some(n=>n[0]===hv)) S.view = hv;
  render();
}
function flash(id,msg){ const el = document.getElementById(id); if (el){ el.textContent = msg; el.className='notice bad'; el.classList.remove('hide'); } }

/* ---------- Selector de materias (profesorado) ---------- */
function courseChipsHTML(prefix, selected){
  const sel = selected || new Set();
  return defaultCourseList().map(c=>{
    const k = courseKey(c);
    const on = subjectsFor(c.level,c.course,c.career).some(x=>sel.has(x.id));
    return `<button type="button" class="chipbtn ${on?'on':''}" data-action="course-chip" data-picker="${prefix}" data-course="${k}">${c.label}</button>`;
  }).join('');
}
function subjectGroupsHTML(prefix, selected){
  const sel = selected || new Set();
  return defaultCourseList().map(c=>{
    const k = courseKey(c);
    const subs = subjectsFor(c.level,c.course,c.career);
    const open = subs.some(x=>sel.has(x.id));
    return `<div class="subjgroup" data-picker="${prefix}" data-course="${k}" style="display:${open?'block':'none'}">
      <div class="tiny" style="font-weight:700;color:var(--gris);margin:2px 0 6px">${c.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px">
        ${subs.map(x=>`<label class="subjlab"><input type="checkbox" class="${prefix}-sub" value="${x.id}" data-course="${k}" ${sel.has(x.id)?'checked':''}><span class="dot" style="background:${x.c}"></span>${x.n}</label>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function toggleCourseChip(btn){
  const prefix = btn.dataset.picker, key = btn.dataset.course;
  const on = btn.classList.toggle('on');
  const grp = document.querySelector(`.subjgroup[data-picker="${prefix}"][data-course="${key}"]`);
  if (grp) grp.style.display = on ? 'block' : 'none';
  updateSubjCount(prefix);
}
function updateSubjCount(prefix){
  const n = document.querySelectorAll('.'+prefix+'-sub:checked').length;
  const el = document.getElementById(prefix+'_subjcount');
  if (el) el.textContent = n;
}
function pickedSubjects(prefix){
  return Array.from(document.querySelectorAll('.'+prefix+'-sub:checked')).map(c=>c.value);
}
/* ---------- Registro ---------- */
function newTrial(){ const t = todayISO(); return { plan:null, cycle:null, paidUntil:null, ref:null, method:null, trialStart:t, trialEnd:addDays(t,TRIAL_DAYS) }; }
function defaultTerms(subjectId){
  const mk = ()=>({ conducta:null, acts:[
    { n:'Evaluación de los temas', w:100, g:null, cat:'eval' },
    { n:'Participación, exposiciones y tareas', w:100, g:null, cat:'part' }
  ]});
  return { 1:mk(), 2:mk(), 3:mk() };
}
function enrollStudent(u){
  const subs = subjectsFor(u.level, u.course, u.career);
  subs.forEach(s=>{
    if (!DB.enrollments.some(e=>e.studentId===u.id && e.subjectId===s.id)){
      DB.enrollments.push({ id:uid('en'), studentId:u.id, subjectId:s.id, schoolId:u.schoolId, teacherId:((DB.users.find(p=>p.role==='prof' && (p.schoolIds||[]).includes(u.schoolId) && (p.subjects||[]).includes(s.id)))||{}).id||null, terms:defaultTerms(s.id) });
    }
  });
}
function doRegisterStudent(e){
  e.preventDefault();
  const g = id => document.getElementById(id) ? document.getElementById(id).value.trim() : '';
  const level = g('rg_level'), phone = g('rg_phone'), email = g('rg_email');
  if (!phone && !email) return flash('rg_err','Indica un teléfono o un correo.');
  if (findByLogin(phone) || (email && findByLogin(email))) return flash('rg_err','Ya existe una cuenta con ese teléfono o correo.');
  const schoolId = g('rg_school');
  const career = level==='ESBA'?null:g('rg_career');
  const allowedGroups = groupsForCourse(schoolId, level, g('rg_course'), career);
  const chosenGroup = allowedGroups.includes(g('rg_group')) ? g('rg_group') : allowedGroups[0];
  const u = { id:uid('u'), role:'alumno', name:g('rg_name'), phone, email, pass:g('rg_pass'),
    level, course:g('rg_course'), career,
    group:chosenGroup,
    schoolId, schoolIds:[schoolId], createdAt:todayISO(), license:newTrial() };
  u.registeredAt = new Date().toISOString(); u.status = 'activo'; u.source = 'autoregistro';
  DB.users.push(u); enrollStudent(u); logEnrollment(u); saveDB();
  S.user = u; S.schoolId = u.schoolId; S.view='inicio'; render();
  toast('Cuenta creada. Tienes 3 meses de prueba gratuita.');
}
function doRegisterTeacher(e){
  e.preventDefault();
  const g = id => document.getElementById(id) ? document.getElementById(id).value.trim() : '';
  const code = g('rg_code').toUpperCase(), code2 = g('rg_code2').toUpperCase();
  const sc = DB.schools.find(s=>s.code.toUpperCase()===code);
  if (!sc) return flash('rg_err','Código de colegio no válido. Pídelo a la dirección del centro.');
  let sc2 = null;
  if (code2){ sc2 = DB.schools.find(s=>s.code.toUpperCase()===code2); if (!sc2) return flash('rg_err','El segundo código de colegio no existe.'); }
  if (findByLogin(g('rg_phone')) || findByLogin(g('rg_email'))) return flash('rg_err','Ya existe una cuenta con ese teléfono o correo.');
  const u = { id:uid('u'), role:'prof', name:g('rg_name'), phone:g('rg_phone'), email:g('rg_email'), pass:g('rg_pass'),
    schoolId:sc.id, schoolIds:[sc.id].concat(sc2?[sc2.id]:[]), subjects:pickedSubjects('rg'), createdAt:todayISO(), license:newTrial() };
  u.registeredAt = new Date().toISOString(); u.status = 'activo'; u.source = 'autoregistro';
  DB.users.push(u); logEnrollment(u); saveDB(); S.user = u; S.schoolId = sc.id; S.view='inicio'; render();
  toast(u.subjects.length ? 'Alta completada en '+sc.name+' con '+u.subjects.length+' materias.' : 'Alta completada. Elige tus materias en «Mis clases».');
}
function doRegisterSchool(e){
  e.preventDefault();
  const g = id => document.getElementById(id) ? document.getElementById(id).value.trim() : '';
  const mode = S.regInstMode || 'vincular';
  let sc;
  if (mode==='vincular'){
    sc = schoolById(g('rg_school'));
    if (!sc) return flash('rg_err','Selecciona un centro del registro nacional.');
    if (DB.users.some(u=>u.role==='inst' && u.schoolId===sc.id)) return flash('rg_err','Ese centro ya tiene una cuenta de institución activa.');
  } else {
    const name = g('rg_sname');
    if (!name) return flash('rg_err','Indica el nombre del colegio.');
    const n = DB.schools.length+1;
    const tipo = g('rg_type');
    sc = { id:uid('sch'), name, city:g('rg_city'), province:g('rg_prov'), district:g('rg_dist'),
      kind: tipo==='universidad'?'universidad':'colegio', type:tipo, status:'verificado',
      code:buildSchoolCode(name, nextCodeSeq()), createdAt:todayISO(),
      plan:{status:'prueba',cycle:null,paidUntil:null,ref:null,method:null,activatedAt:null} };
    DB.schools.push(sc);
  }
  if (findByLogin(g('rg_phone')) || findByLogin(g('rg_email'))) return flash('rg_err','Ya existe una cuenta con ese teléfono o correo.');
  sc.plan = sc.plan || {status:'prueba'};
  const u = { id:uid('u'), role:'inst', name:'Dirección · '+sc.name, phone:g('rg_phone'), email:g('rg_email'), pass:g('rg_pass'),
    schoolId:sc.id, schoolIds:[sc.id], createdAt:todayISO(), license:{plan:'inst', cycle:null, paidUntil:null, ref:null, method:null, trialStart:todayISO(), trialEnd:addDays(todayISO(),TRIAL_DAYS)} };
  DB.users.push(u); saveDB(); S.user=u; S.schoolId=sc.id; S.view='inicio'; render();
  S.modal = 'code';
  toast('Centro vinculado. Código generado: '+sc.code);
}
function doRegisterFamily(e){
  e.preventDefault();
  const g = id => document.getElementById(id) ? document.getElementById(id).value.trim() : '';
  if (findByLogin(g('rg_phone')) || findByLogin(g('rg_email'))) return flash('rg_err','Ya existe una cuenta con ese teléfono o correo.');
  const child = findByLogin(g('rg_child')||'');
  const u = { id:uid('u'), role:'familia', name:g('rg_name'), phone:g('rg_phone'), email:g('rg_email'), pass:g('rg_pass'),
    schoolId: child?child.schoolId:null, schoolIds: child?[child.schoolId]:[], children: child?[child.id]:[],
    createdAt:todayISO(), license:newTrial() };
  DB.users.push(u);
  if (child){ child.familyId = u.id; }
  saveDB(); S.user=u; S.view='inicio'; render(); toast('Cuenta familiar creada.');
}

function initials(n){ return (n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function roleLabel(u){

function blockedBanner(u){

}

  const u = S.user;

function statCard(k,v,d,color){
  return `<div class="card kpi"><div class="k">${k}</div><div class="v" style="${color?'color:'+color:''}">${v}</div><div class="d">${d||''}</div></div>`;
}
function inicioAlumno(u){
  const rows = subjectAverage(u.id);
  const anual = annualResult(u.id);

  const today = DAYS[(new Date().getDay()+6)%7] || 'Lunes';

  const g = gradeOf(anual);
  return `
  <div class="page-head"><div><h1>Hola, ${u.name.split(' ')[0]}</h1><p>${courseLabel(u)} · ${schoolById(u.schoolId)?.name||''} · Trimestre ${S.term}</p></div>
    <div style="display:flex;gap:8px"><button class="btn sec" data-action="go" data-view="boletin">Ver boletín</button><button class="btn" data-action="go" data-view="notas">Mis notas</button></div></div>
  <div class="grid g4" style="margin-bottom:18px">
    ${statCard('Promedio anual', anual!==null?anual.toFixed(2).replace('.',','):'—', g?g.label:'Sin evaluar', g?g.color:'')}
    ${statCard('Asignaturas', rows.length, 'matriculadas', '')}
    ${statCard('Trimestre', S.term+'º', 'de 3 · '+DB.settings.year, '')}
    ${statCard('Licencia', st.status==='activo'?'Activa':st.status==='prueba'?st.days+' días':'Vencida', st.label, st.status==='bloqueado'?'#B3261E':'')}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Rendimiento por asignatura</h3>
      ${rows.length?`<table><thead><tr><th>Asignatura</th>${periodsForLevel(u.level).map(p=>`<th class="t-term">${shortPeriod(u.level,p)}</th>`).join('')}<th>Media</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.subject.c};margin-right:8px"></span>${r.subject.n}</td>
          ${periodsForLevel(u.level).map((p,idx)=>`<td class="num t-term">${r.terms[idx]!==undefined&&r.terms[idx]!==null?r.terms[idx].toFixed(1).replace('.',','):'—'}</td>`).join('')}
          <td>${gradePill(r.avg)}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">Aún no hay matrículas registradas.</div>'}

      <div class="card">
        <h3>Hoy · ${today}</h3>
        ${lessons.length?lessons.sort((a,b)=>a.slot-b.slot).map(l=>{const s=subjectById(l.subjectId);const t=userById(l.teacherId);return `
          <div class="lesson" style="border-left-color:${s.c}"><div class="l1"><span>${s.n}</span><span class="chip">${SLOTS[l.slot]}</span></div>
          <div class="l2">${t?t.name:'—'} · Aula ${l.room}</div></div>`}).join(''):'<div class="empty">No hay clases programadas para hoy.</div>'}
        <button class="btn sec sm" style="margin-top:8px" data-action="go" data-view="horario">Ver horario completo</button>
      </div>
      <div class="card">
        <h3>Cómo se calcula tu nota</h3>
        <p class="small muted" style="margin:0 0 10px">Cada trimestre combina las actividades del periodo con la conducta y puntualidad, que pesa un <b>5 % sobre el trimestre completo</b> (no por tema).</p>
        <div class="legend">${SCALE.map(s=>`<span class="gr ${s.cls}"><i class="dot"></i>${s.min.toFixed(1).replace('.',',')}–${s.max.toFixed(1).replace('.',',')} ${s.label}</span>`).join('')}</div>
      </div>
    </div>
  </div>`;
}
function inicioProf(u){
  const classes = classesOf(u);
  const totalStudents = new Set();
  DB.enrollments.filter(e=>classes.includes(e.subjectId) && e.schoolId===u.schoolId).forEach(e=>totalStudents.add(e.studentId));
  let pending = 0;
  DB.enrollments.filter(e=>classes.includes(e.subjectId)).forEach(e=>{ const r = termResult(e, S.term); if (!r) pending++; });
  return `
  <div class="page-head"><div><h1>Panel del profesorado</h1><p>${u.name} · ${classes.length} asignaturas · Trimestre ${S.term}</p></div>
    <div style="display:flex;gap:8px"><button class="btn" data-action="go" data-view="libro">Calificar</button></div></div>
  <div class="grid g4" style="margin-bottom:18px">
    ${statCard('Asignaturas', classes.length, 'asignadas', '')}
    ${statCard('Alumnos', totalStudents.size, 'en tus clases', '')}
    ${statCard('Pendientes', pending, 'sin nota en T'+S.term, pending?'#B4510A':'')}
    ${statCard('Licencia', licenseState(u).status==='activo'?'Activa':'Prueba', licenseState(u).label, '')}
  </div>
  <div class="card">
    <h3>Mis asignaturas</h3>
    ${classes.length?`<table><thead><tr><th>Asignatura</th><th class="col-opt">Curso</th><th>Alumnos</th><th>Nota media T${S.term}</th><th></th></tr></thead><tbody>
      ${classes.map(sid=>{
        const s = subjectById(sid);
        const ens = DB.enrollments.filter(e=>e.subjectId===sid && e.schoolId===u.schoolId);
        const rs = ens.map(e=>termResult(e,S.term)).filter(Boolean);
        const avg = rs.length?(rs.reduce((a,r)=>a+r.final,0)/rs.length):null;
        const curso = ens.length? (userById(ens[0].studentId)||{}):null;
        return `<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.c};margin-right:8px"></span>${s.n}</td>
        <td class="col-opt">${curso?courseLabel(curso):'—'}</td><td class="num">${ens.length}</td><td>${gradePill(avg)}</td>
        <td><button class="btn sm sec" data-action="go" data-view="libro">Abrir</button></td></tr>`}).join('')}
    </tbody></table>`:'<div class="empty">Aún no tienes asignaturas asignadas. La dirección del centro debe asignártelas.</div>'}
  </div>`;
}

  <div class="page-head"><div><h1>${sc.name}</h1><p>${sc.city} · ${sc.province} · Código ${sc.code}</p></div>

      </div>
      <div class="bar" style="margin-bottom:12px"><i style="width:${avg}%;background:${avg>=80?'#16A34A':avg>=50?'#E5A200':'#D32F2F'}"></i></div>
      ${rows.slice(0,3).map(r=>`<div class="lesson" style="border-left-color:${r.pct>=80?'#16A34A':r.pct>=50?'#E5A200':'#D32F2F'}">
        <div class="l1"><span>${r.subject.n}</span><span>${r.pct} %</span></div>
        <div class="l2">${r.taught.length}/${r.total.length} temas · ${r.pending.length?r.pending.length+' pendiente(s)':'completo'}</div></div>`).join('')}
    </div>`;
  })()}
  <div class="grid g2">
    <div class="card"><h3>Distribución por escala oficial</h3>

        <div class="bar"><i style="width:${(d.n/maxd*100).toFixed(0)}%;background:${d.color}"></i></div></div>`).join('')}
      <div class="tiny muted" style="margin-top:12px">Escala: 0–2,9 suspenso · 3–4,9 no apto · 5–6,9 apto · 7–8,4 notable · 8,5–10 sobresaliente.</div>
    </div>
    <div class="card"><h3>Últimas altas</h3>
      ${(()=>{const regs=allRegistrations(sc.id);return regs.length?regs.slice(0,4).map(r=>`<div class="lesson" style="border-left-color:${r.role==='alumno'?'#0A6E9E':'#16A34A'}">

      <button class="btn sec sm" data-action="go" data-view="auditoria" style="margin-top:6px">Ver auditoría</button>

    <div class="card"><h3>Últimos movimientos</h3>

function schedGroups(schoolId){
  const map = new Map();
  const sc = schoolById(schoolId);
  Object.keys((sc && sc.groups) || {}).forEach(k=>{
    const n = sc.groups[k]||0;
    if (n<=0) return;
    const p = k.split(':'), level=p[0]||'ESBA', course=p[1]||'1', career=p[2]||null;
    groupLetters(n).forEach(g=>{
      const key = level+':'+course+':'+(career||'')+':'+g;
      map.set(key, { key, level, course, career, group:g, label:courseLabel({level,course,career})+' · Grupo '+g });
    });
  });
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId).forEach(s=>{
    const g = s.group||'A';
    const k = (s.level||'ESBA')+':'+(s.course||'1')+':'+(s.career||'')+':'+g;
    if (!map.has(k)) map.set(k, { key:k, level:s.level||'ESBA', course:s.course||'1', career:s.career||null, group:g, label:courseLabel(s)+' · Grupo '+g });
  });
  if (!map.size) DB.schedule.filter(l=>l.schoolId===schoolId).forEach(l=>{
    const g = l.group||'A';
    const k = (l.level||'ESBA')+':'+(l.course||'1')+':'+(l.career||'')+':'+g;
    if (!map.has(k)) map.set(k, { key:k, level:l.level||'ESBA', course:l.course||'1', career:l.career||null, group:g, label:'Curso '+(l.course||'1')+' · Grupo '+g });
  });
  return Array.from(map.values()).sort((a,b)=> levelRank(a.level)-levelRank(b.level) || String(a.course).localeCompare(String(b.course)) || a.group.localeCompare(b.group));
}

function catAvgOf(e,term,cat){
  const t=e.terms[term]; if(!t) return '—';
  const it=(t.acts||[]).filter(a=>a.g!==null&&a.g!==undefined&&a.g!==''&&!isNaN(a.g)&&activityCategory(a)===cat);
  if(!it.length) return '—';
  const w=it.reduce((x,a)=>x+(Number(a.w)||1),0);
  return it.reduce((x,a)=>x+(Number(a.w)||1)/w*Number(a.g),0).toFixed(1).replace('.',',');
}
function fmtG(v){ return (v===null||v===undefined||v==='') ? '' : String(Number(v)).replace('.',','); }
function parseG(v){ v=String(v||'').trim().replace(',','.'); if(v==='') return null; const n=Number(v); return isNaN(n)?null:Math.max(0,Math.min(10,n)); }
function topicsOfLibro(u,sid,term){ const en=syllabusEntry(u.id,sid,Number(term),false); return (en?en.topics:[]).map((t,i)=>({key:t.id||('t'+i),n:t.n||('Tema '+(i+1))})); }
function topicGradeOf(e,term,key,cat){ const t=e.terms[term]; const a=t&&(t.acts||[]).find(x=>x.tp===key&&activityCategory(x)===cat); return a?a.g:null; }
function setTopicGrade(enrId,term,key,cat,val){
  const e=DB.enrollments.find(x=>x.id===enrId); if(!e) return;
  const t=e.terms[term]=e.terms[term]||{conducta:null,acts:[]};
  const v=parseG(val);
  t.acts=(t.acts||[]).filter(a=>a.tp || (a.g!==null&&a.g!==undefined&&a.g!==''));
  let a=t.acts.find(x=>x.tp===key&&activityCategory(x)===cat);
  if(v===null){ t.acts=t.acts.filter(x=>x!==a); }
  else if(a){ a.g=v; }
  else { const tp=topicsOfLibro(S.user,e.subjectId,term).find(x=>x.key===key); t.acts.push({n:tp?tp.n:'Tema',w:1,g:v,cat,tp:key}); }
  saveDB(); render();
}
function setConducta(enrId,term,val){
  const e=DB.enrollments.find(x=>x.id===enrId); if(!e) return;
  const t=e.terms[term]=e.terms[term]||{conducta:null,acts:[]};

}

function viewGrupos(){
  const sc = schoolById(S.schoolId);
  const keys = new Set(Object.keys(sc.groups||{}));
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===sc.id).forEach(a=>keys.add((a.level||'ESBA')+':'+(a.course||'1')+':'+((a.level==='ESBA'?null:a.career)||'')));
  DB.schedule.filter(l=>l.schoolId===sc.id).forEach(l=>keys.add((l.level||'ESBA')+':'+(l.course||'1')+':'+(l.career||'')));
  const rows = Array.from(keys).map(k=>{
    const p = k.split(':');
    const level = p[0], course = p[1], career = p[2]||null;
    const defined = (sc.groups||{})[k]||0;
    const letters = defined>0 ? groupLetters(defined) : groupsForCourse(sc.id, level, course, career);
    const students = DB.users.filter(u=>u.role==='alumno' && u.schoolId===sc.id && u.level===level && String(u.course)===String(course) && ((u.level==='ESBA'?null:u.career)||null)===(career||null));
    const per = {};
    students.forEach(x=>{ const g=x.group||'A'; per[g]=(per[g]||0)+1; });
    return { key:k, label:courseLabel({level, course, career}), letters, defined:defined||letters.length, students:students.length, per };
  }).sort((a,b)=>{ const pa=a.key.split(':'), pb=b.key.split(':'); return levelRank(pa[0])-levelRank(pb[0]) || String(pa[1]).localeCompare(String(pb[1])) || (pa[2]||'').localeCompare(pb[2]||''); });
  const available = defaultCourseList().filter(c=>!keys.has(courseKey(c)));
  return `
  <div class="page-head"><div><h1>Grupos por curso</h1><p>Define los grupos y reparte automáticamente el alumnado de forma equilibrada</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sec" data-action="listados" data-mode="grupos">Listado de grupos</button>
      <button class="btn sec" data-action="listados" data-mode="alumnos">Listas de alumnos</button>
      <button class="btn" data-action="auto-groups">Crear grupos automáticamente</button>
    </div></div>
  <div class="notice info" style="margin-bottom:18px">Primero define aquí los grupos (por ejemplo, 1º ESBA A y B). Después, cuando un alumno se registre en ese curso, podrá escoger entre los grupos que hayas creado. Los horarios se organizan también por grupo.</div>
  ${rows.length?`<div class="card" style="margin-bottom:18px">
    <table><thead><tr><th>Curso</th><th>Grupos</th><th>Alumnos</th><th style="width:140px">Nº de grupos</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td><div style="font-weight:650">${r.label}</div><div class="tiny muted">${r.students} alumno${r.students===1?'':'s'} matriculado${r.students===1?'':'s'}</div></td>
        <td><div style="display:flex;gap:6px;flex-wrap:wrap">${r.letters.map(g=>`<span class="pill ${ (r.per[g]||0)>0?'ok':'gray'}">Grupo ${g}</span>`).join('')}</div></td>
        <td class="tiny muted">${r.letters.map(g=>'Grupo '+g+': '+(r.per[g]||0)).join(' · ')}</td>
        <td><select onchange="setCourseGroups(this)" data-key="${r.key}" style="padding:6px 8px">
          ${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===r.defined?'selected':''}>${n} grupo${n===1?'':'s'}</option>`).join('')}
        </select></td>
        <td><button class="btn sec sm" data-action="auto-groups" data-key="${r.key}" ${r.students?'':'disabled title="Sin alumnos"'}>Repartir</button></td>
      </tr>`).join('')}
    </tbody></table>
  </div>`:'<div class="empty" style="margin-bottom:18px">Todavía no hay cursos. Añade uno abajo para definir sus grupos.</div>'}
  <div class="card">
    <h3>Añadir un curso sin alumnos todavía</h3>
    <div class="row">
      <div class="field" style="margin:0"><label>Curso</label>
        <select id="add_course_key">${available.map(c=>`<option value="${courseKey(c)}">${c.label}</option>`).join('')||'<option value="">Todos los cursos están ya configurados</option>'}</select>
      </div>
      <div style="display:flex;align-items:flex-end"><button class="btn" data-action="add-course-groups">Añadir curso</button></div>
    </div>
    <div class="tiny muted" style="margin-top:8px">Al añadirlo se crea con 1 grupo (A); después puedes subir el número. Sirve para preparar el horario antes de que lleguen las matrículas.</div>
  </div>`;
}

/* ---------- Instalar como aplicación ---------- */
function installState(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

}

function listKeysForSchool(schoolId){
  const sc = schoolById(schoolId);
  const keys = new Set(Object.keys(sc.groups||{}));
  DB.users.filter(u=>u.role==='alumno' && u.schoolId===schoolId).forEach(a=>keys.add((a.level||'ESBA')+':'+(a.course||'1')+':'+((a.level==='ESBA'?null:a.career)||'')));
  return Array.from(keys).sort((a,b)=>{ const pa=a.split(':'), pb=b.split(':'); return levelRank(pa[0])-levelRank(pb[0]) || String(pa[1]).localeCompare(String(pb[1])) || (pa[2]||'').localeCompare(pb[2]||''); });
}
function todayLong(){
  return new Date().toLocaleDateString('es-ES',{ day:'2-digit', month:'long', year:'numeric' });
}

}
function viewListados(){

function listadoGruposHTML(sc, blocks){
  return `
  ${printHeaderHTML(sc, 'Listado de grupos por curso', 'Resumen de grupos y número de alumnos')}
  <table class="print-table">
    <thead><tr><th style="width:34%">Curso</th><th style="width:16%">Grupo</th><th style="width:20%">Nº de alumnos</th><th>Relación</th></tr></thead>
    <tbody>
      ${blocks.length?blocks.map(b=>b.letters.map((g,i)=>{
        const list = b.students.filter(s=>(s.group||'A')===g);
        return `<tr>
          ${i===0?`<td rowspan="${b.letters.length}" class="b">${b.label}</td>`:''}
          <td class="b">Grupo ${g}</td><td>${list.length}</td>
          <td class="tiny">${list.length?list.map(s=>s.name).join(', '):'—'}</td>
        </tr>`;
      }).join('')).join(''):'<tr><td colspan="4">Sin cursos configurados.</td></tr>'}
    </tbody>
  </table>
  <div class="print-foot">Total: ${blocks.reduce((a,b)=>a+b.students.length,0)} alumnos en ${blocks.reduce((a,b)=>a+b.letters.length,0)} grupos · ${blocks.length} cursos</div>
  <div class="print-sign">Firma y sello de la dirección</div>`;
}
function listadoAlumnosHTML(sc, blocks){
  const pages = [];
  blocks.forEach(b=>{
    b.letters.forEach(g=>{
      const list = b.students.filter(s=>(s.group||'A')===g).sort((x,y)=>x.name.localeCompare(y.name,'es'));
      pages.push({ b, g, list });
    });
  });
  return pages.filter(p=>p.list.length).map((p,i)=>`
    <div class="print-block ${i===0?'':'new-page'}">
      ${printHeaderHTML(sc, 'Lista de alumnos · '+p.b.label, 'Grupo '+p.g+' · '+p.list.length+' alumno'+(p.list.length===1?'':'s'))}
      <table class="print-table">
        <thead><tr><th style="width:8%">Nº</th><th style="width:50%">Nombre y apellidos</th><th style="width:20%">Teléfono</th><th>Alta</th></tr></thead>
        <tbody>
          ${p.list.length?p.list.map((s,k)=>`<tr><td>${k+1}</td><td>${s.name}</td><td>${s.phone||'—'}</td><td class="tiny">${fmtDate(s.registeredAt||s.createdAt)}</td></tr>`).join(''):'<tr><td colspan="4">Sin alumnos en este grupo.</td></tr>'}
        </tbody>
      </table>
      <div class="print-sign">Firma y sello de la dirección</div>
    </div>`).join('');
}

function viewTemarioProf(u){

  const sid = S.temSub && subjects.includes(S.temSub) ? S.temSub : (S.temSub = subjects[0]);
  const level = levelForSubject(sid);
  const periods = periodsForLevel(level);
  const per = periods.includes(Number(S.temPeriod)) ? Number(S.temPeriod) : 1;
  const entry = syllabusEntry(u.id, sid, per, false);
  const topics = entry ? entry.topics : [];
  const subj = subjectById(sid);
  return `

          ${subjects.map(c=>`<option value="${c}" ${c===sid?'selected':''}>${subjectById(c).n}</option>`).join('')}
        </select>
      </div>
      <div style="flex:0 0 auto">
        <label>Periodo</label>
        <div class="tabs" style="margin:0">
          ${periods.map(p=>`<button class="${p===per?'on':''}" data-action="tem-period" data-p="${p}">${periodLabel(level,p)}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">

/* ---------- QR ---------- */
function qrSVG(){
  const bin = atob(QR.b64), n = QR.n;
  let bits = '';
  for (let i=0;i<bin.length;i++){ const b = bin.charCodeAt(i).toString(2); bits += b.padStart(8,'0'); }
  let rects = '';
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    if (bits[y*n+x]==='1') rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><g fill="#08301D">${rects}</g></svg>`;
}

function applyAutoGroups(){
  const keyEl = document.getElementById('auto_course');
  const nEl = document.getElementById('auto_n');
  if (!keyEl) return;
  const key = keyEl.value;
  const n = Math.max(1, Math.min(8, Number(nEl.value)||1));
  const plan = autoPlanGroups(S.schoolId, key, n);
  const sc = schoolById(S.schoolId);
  sc.groups = sc.groups||{}; sc.groups[key] = n;
  plan.out.forEach(o=>o.list.forEach(st=>{ st.group = o.g; }));
  saveDB(); closeModal(); render();
  toast(courseLabelFromKey(key)+': '+plan.students.length+' alumnos repartidos en '+plan.out.map(o=>o.g+'='+o.list.length).join(' · '));
}

function gatherActs(e, t){
  const rows = Array.from(document.querySelectorAll('#acts .act-row'));
  const acts = rows.map((r,i)=>{
    const n = r.querySelector('.act-n').value.trim() || ('Actividad '+(i+1));
    const w = Number(r.querySelector('.act-w').value||0);
    const gv = r.querySelector('.act-g').value;
    const topic = r.dataset.topic || '';
    const cat = r.dataset.cat === 'part' ? 'part' : 'eval';
    return { n, w, g: gv===''?null:clamp(Number(gv),0,10), cat, ...(topic?{topicId:topic}:{}) };
  });
  e.terms[t].acts = acts;
  const c = document.getElementById('cond');
  if (c) e.terms[t].conducta = c.value===''?null:clamp(Number(c.value),0,10);
}

function verifyAccount(){

  g.verifiedAt = todayISO();

async function testGateway(){
  const g = DB.settings.gateway || {};
  if (!g.endpoint){
    g.lastCheck = { at:new Date().toISOString(), ok:false, msg:'Falta el endpoint' };
    DB.settings.gateway = g; saveDB(); render();
    toast('Configura primero el endpoint del servidor.');
    return;
  }
  toast('Comprobando la conexión con el servidor…');
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const res = await fetch(g.endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Merchant-Key': g.merchantKey||'' },
      body: JSON.stringify({ action:'ping', merchantId:g.merchantId||'', account:PAY.account, currency:'XAF' }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    g.lastCheck = { at:new Date().toISOString(), ok:res.ok, msg:'HTTP '+res.status };
  }catch(err){
    g.lastCheck = { at:new Date().toISOString(), ok:false, msg:'No se pudo contactar (CORS o red)' };
  }
  DB.settings.gateway = g; saveDB(); render();
  toast(g.lastCheck.ok ? 'Conexión correcta con el servidor de verificación.' : 'No se pudo verificar la conexión: '+g.lastCheck.msg);
}
function simulateConnection(){
  const sel = document.getElementById('sim_conn');
  const kind = (sel && sel.value) || 'ok';
  const g = DB.settings.gateway = DB.settings.gateway || {};
  const apply = () => {
    const at = new Date().toISOString();
    if (kind === 'ok') g.lastCheck = { at, ok:true, msg:'Simulación: HTTP 200' };
    else if (kind === 'error500') g.lastCheck = { at, ok:false, msg:'Simulación: HTTP 500' };
    else g.lastCheck = { at, ok:false, msg:'Simulación: tiempo de espera agotado' };
    if (!DB.audit) DB.audit = [];
    DB.audit.push({ id:uid('log'), action:'simulacion', at, schoolId:S.schoolId, userId:S.user.id, name:S.user.name, role:'inst',
      mode:'sim', code:'CONEXIÓN', detail:'Endpoint · '+(kind==='ok'?'éxito HTTP 200':kind==='error500'?'error HTTP 500':'tiempo de espera'), device:'Simulador' });
    saveDB(); render();
    toast(kind==='ok' ? 'Simulación: conexión correcta (HTTP 200).' : kind==='error500' ? 'Simulación: el servidor devuelve error 500.' : 'Simulación: tiempo de espera agotado.');
  };
  if (kind === 'timeout'){ toast('Simulando tiempo de espera…'); setTimeout(apply, 900); }
  else apply();
}

function simulateVerification(){
  const sel = document.getElementById('sim_order');
  const resSel = document.getElementById('sim_result');
  if (!sel || !sel.value) return toast('No hay órdenes pendientes que simular.');
  const p = DB.payments.find(x=>x.id===sel.value);
  const result = (resSel && resSel.value) || 'pending';
  if (!p) return;
  if (!DB.audit) DB.audit = [];
  if (result === 'confirmed'){
    confirmPayment(p.id, true, 'Simulación del servidor');
  } else if (result === 'rejected'){
    p.status = 'rechazado'; p.confirmedAt = new Date().toISOString(); p.confirmedBy = 'Simulación del servidor';
    saveDB(); render(); toast('Simulación: pago rechazado · '+p.ref);
  } else {
    toast('Simulación: el servidor devuelve «pendiente» · la orden '+p.ref+' sigue abierta.');
  }
  DB.audit.push({ id:uid('log'), action:'simulacion', at:new Date().toISOString(), schoolId:p.schoolId,
    userId:p.userId, name:(userById(p.userId)||{}).name||p.name||'', role:'inst', mode:'sim', code:p.ref,
    detail:'Respuesta simulada: '+result, device:'Simulador' });
  saveDB();
}

function verifyOrder(id){
  const g = gatewayCfg();
  if (g.mode==='auto' && g.endpoint){ verifyOrderRemote(id); return; }
  toast('Verificación manual: la transferencia la confirma el centro o la administración.');
}
async function verifyOrderRemote(id){
  const g = gatewayCfg();
  const p = DB.payments.find(x=>x.id===id);
  if (!p) return;
  toast('Consultando el pago al servidor…');
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const res = await fetch(g.endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Merchant-Key': g.merchantKey||'' },
      body: JSON.stringify({ action:'verify', reference:p.ref, amount:p.amountXAF, currency:'XAF', account:PAY.account, merchantId:g.merchantId||'' }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    const data = await res.json().catch(()=>({}));
    if (res.ok && (data.status==='confirmed' || data.status==='paid')){ confirmPayment(id, true); }
    else { toast('El servidor no confirma el pago ('+(data.status || ('HTTP '+res.status))+').'); }
  }catch(err){
    toast('No se pudo contactar con el servidor de verificación. La orden sigue pendiente.');
  }
}

function createOrder(plan, cycle, ref){
  const u = S.user;
  const amount = amountFor(plan, cycle);
  const p = { id:uid('pay'), userId:u.id, schoolId:u.schoolId, plan, cycle,
    amountEUR:amount, amountXAF:toXAF(amount), method:'Transferencia Ecobank',
    ref, status:'pendiente', date:todayISO(), createdAt:new Date().toISOString(), name:u.name };
  DB.payments.push(p); saveDB();
  S.lastPayment = p.id; S.modal='pay-done'; renderModal();
}
function confirmPayment(id, auto, label){
  const p = DB.payments.find(x=>x.id===id);
  if (!p || p.status==='confirmado') return;
  p.status = 'confirmado';
  p.confirmedAt = new Date().toISOString();
  p.confirmedBy = auto ? (label || 'Verificación bancaria (demostración)') : S.user.name;
  const payer = userById(p.userId);
  let until = null;
  if (payer){
    const base = payer.license && payer.license.paidUntil && daysLeft(payer.license.paidUntil) > 0 ? payer.license.paidUntil : todayISO();
    until = addCycle(base, p.cycle);
    payer.license = Object.assign({}, payer.license||{}, { plan:p.plan, cycle:p.cycle, paidUntil:until, method:p.method, ref:p.ref, activatedAt:todayISO() });
    if (p.plan==='inst'){
      const sc = schoolById(p.schoolId);
      if (sc) sc.plan = { status:'activo', cycle:p.cycle, paidUntil:until, ref:p.ref, method:p.method, activatedAt:todayISO() };
    }
  }
  if (!DB.audit) DB.audit = [];
  DB.audit.push({ id:uid('log'), action:'pago', at:new Date().toISOString(), schoolId:p.schoolId, userId:p.userId,
    name:(payer&&payer.name)||p.name||'', role:(payer&&payer.role)||'', mode:'pago', code:p.ref,
    detail:fmtEUR(p.amountEUR)+' · '+p.ref, device:'Sistema' });
  saveDB(); closeModal(); render();
  toast('Pago confirmado · '+p.ref+(until?' · licencia hasta '+until:''));
}
function rejectPayment(id){
  const p = DB.payments.find(x=>x.id===id);
  if (!p) return;
  p.status = 'rechazado'; p.confirmedAt = new Date().toISOString(); p.confirmedBy = S.user.name;
  saveDB(); render(); toast('Pago rechazado · '+p.ref);
}

function unlinkFromSchool(){
  const u = S.user;
  const sc = schoolById(u.schoolId);
  if (!sc) return;
  const prev = { schoolId:sc.id, name:sc.name, at:new Date().toISOString() };
  u.previousSchools = u.previousSchools || [];
  u.previousSchools.push(prev);
  u.schoolIds = (u.schoolIds||[]).filter(id=>id!==sc.id);
  u.schoolId = u.schoolIds[0] || null;
  S.schoolId = u.schoolId;
  if (u.role==='alumno') u.group = null;
  if (!DB.audit) DB.audit = [];
  DB.audit.push({ id:uid('log'), action:'baja', at:new Date().toISOString(), schoolId:sc.id, userId:u.id,
    name:u.name, role:u.role, mode:'baja', code:sc.code, detail:'Baja voluntaria del centro', device:'—' });
  saveDB(); closeModal();
  if (u.role==='alumno') S.view='vincular';
  render();
  toast('Te has desvinculado de '+sc.name+'.');
}
function linkStudentToSchool(ev){

function setCourseGroups(sel){
  const sc = schoolById(S.schoolId);
  const key = sel.dataset.key;
  let n = Number(sel.value);
  const p = key.split(':'), level=p[0], course=p[1], career=p[2]||null;
  const used = new Set(DB.users.filter(u=>u.role==='alumno' && u.schoolId===sc.id && u.level===level && String(u.course)===String(course) && ((u.level==='ESBA'?null:u.career)||null)===(career||null)).map(x=>x.group||'A'));
  const minN = used.size ? Math.max(...Array.from(used).map(g=>g.charCodeAt(0)-64)) : 0;
  if (n < minN){
    toast('No puedes dejar menos de '+minN+' grupos: hay alumnos en '+Array.from(used).sort().join(', ')+'.');
    n = minN;
  }
  sc.groups = sc.groups||{}; sc.groups[key] = n;
  saveDB(); render();
  toast('Grupos actualizados: '+courseLabelFromKey(key)+' → '+groupLetters(n).join(', '));
}

function saveSlot(){
  const d = S.slotData; if (!d) return;
  const c = parseCourseKey(S.schedKey);
  const subjectId = document.getElementById('slot_subject').value;
  const teacherId = document.getElementById('slot_teacher').value;
  const room = (document.getElementById('slot_room').value||'').trim() || 'A-101';
  if (!subjectId) return toast('Elige una materia.');
  if (teacherId){
    const clash = DB.schedule.find(l=>l.schoolId===S.schoolId && l.teacherId===teacherId && l.day===d.day && l.slot===d.slot &&
      !(String(l.course)===String(c.course) && (l.group||'A')===c.group));
    if (clash){
      const t = userById(teacherId), sb = subjectById(clash.subjectId);
      return toast('Choque de horario: '+t.name+' ya imparte '+sb.n+' a esa hora. Elige otro profesor u otra franja.');
    }
  }
  let e = DB.schedule.find(l=>l.schoolId===S.schoolId && String(l.course)===String(c.course) && (l.group||'A')===c.group && l.day===d.day && l.slot===d.slot);
  if (e){ Object.assign(e, { subjectId, teacherId, room, level:c.level, career:c.career }); }
  else { DB.schedule.push({ id:uid('sl'), schoolId:S.schoolId, level:c.level, course:String(c.course), career:c.career, group:c.group, day:d.day, slot:d.slot, subjectId, teacherId, room }); }
  saveDB(); S.modal=null; render(); toast('Horario actualizado.');
}
function clearSlot(){
  const d = S.slotData; if (!d) return;
  const c = parseCourseKey(S.schedKey);
  DB.schedule = DB.schedule.filter(l=> !(l.schoolId===S.schoolId && String(l.course)===String(c.course) && (l.group||'A')===c.group && l.day===d.day && l.slot===d.slot));
  saveDB(); S.modal=null; render(); toast('Bloque vaciado.');
}
function distributeWeights(acts){
  if (!acts.length) return;
  ['eval','part'].forEach(c=>{
    const items = acts.filter(a=>activityCategory(a)===c);
    if (!items.length) return;
    const each = Math.round((100/items.length)*10)/10;
    items.forEach(a=>{ a.w = each; });
  });
}
function createTopicAndActivity(enrId, term){
  const e = DB.enrollments.find(x=>x.id===enrId);
  if (!e) return;
  const input = document.getElementById('new_topic_name');
  const name = (input ? input.value : '').trim();
  if (!name) return toast('Escribe el nombre del tema.');
  gatherActs(e, term);
  const entry = syllabusEntry(S.user.id, e.subjectId, term, true);
  const topic = { id:uid('t'), n:name, taught:true };
  entry.topics.push(topic);
  e.terms[term].acts = e.terms[term].acts || [];
  e.terms[term].acts.push({ n:topicActivityName(entry.topics.length-1, name), w:1, g:null, cat:'eval', topicId:topic.id });
  distributeWeights(e.terms[term].acts);
  saveDB();
  S.modal='grade'; S.gradeEnr=enrId; S.gradeTerm=term;
  render();
  toast('Tema añadido al temario y al libro de notas.');
}
function importSyllabusTopics(enrId, term){
  const e = DB.enrollments.find(x=>x.id===enrId);
  if (!e) return;
  const entry = syllabusEntry(S.user.id, e.subjectId, term, false);
  if (!entry || !entry.topics.length) return toast('No hay temas en el temario para este periodo.');
  const acts = e.terms[term].acts = e.terms[term].acts || [];
  const have = new Set(acts.filter(a=>a.topicId).map(a=>a.topicId));
  let added = 0;
  entry.topics.forEach((tp,i)=>{
    tp.taught = true;
    if (have.has(tp.id)) return;
    acts.push({ n:topicActivityName(i, tp.n), w:1, g:null, cat:'eval', topicId:tp.id });
    added++;
  });
  distributeWeights(acts);
  saveDB();
  S.modal='grade'; S.gradeEnr=enrId; S.gradeTerm=term; renderModal(); render();
  toast(added+' temas vinculados y pesos repartidos.');
}

function saveTemario(){

function copyPreviousPeriod(){

  if (!DB.audit) DB.audit = [];
  DB.audit.push({ id:uid('log'), action:'revoke', at:new Date().toISOString(), schoolId:sc.id,
